<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffd6e8" />
<title>Happy Birthday Kanaka Sruthi Rajesh 🎉</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }

body{
  font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color:#7a1f47;
  background:linear-gradient(135deg,#ffe9f3 0%,#ffd6e8 22%,#ffe3f0 45%,#ffc9e0 70%,#ffe9f3 100%);
  background-size:400% 400%;
  animation:bgMove 24s ease infinite;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
@keyframes bgMove{
  0%  { background-position:0% 50%; }
  50% { background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}
body::before{
  content:'';
  position:fixed; inset:-10%;
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.65), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(255,182,213,.45), transparent 48%),
    radial-gradient(circle at 60% 10%, rgba(255,255,255,.35), transparent 35%);
  pointer-events:none; z-index:0;
  animation:shimmer 14s ease-in-out infinite alternate;
}
@keyframes shimmer{
  0%  { transform:translate3d(0,0,0)    scale(1);    opacity:.85; }
  100%{ transform:translate3d(2%,-2%,0) scale(1.06); opacity:1;   }
}

/* ============================================================
   FX CANVAS + FLASH
   ============================================================ */
#fxCanvas{ position:fixed; inset:0; z-index:50; pointer-events:none; }
#flash{
  position:fixed; inset:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.95), rgba(255,214,232,.55) 45%, rgba(255,214,232,0) 75%);
  opacity:0; pointer-events:none; z-index:500;
  transition:opacity .65s ease;
}
#flash.on{ opacity:1; transition:opacity .07s ease; }

/* ============================================================
   MUSIC BUTTON
   ============================================================ */
#musicBtn{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top));
  right:14px;
  z-index:600;
  width:46px; height:46px;
  display:grid; place-items:center;
  font-size:1.15rem;
  border:2px solid rgba(255,255,255,.95);
  border-radius:50%;
  cursor:pointer;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 22px rgba(214,51,108,.22);
  transition:transform .15s ease, box-shadow .2s ease;
}
#musicBtn:active{ transform:scale(.92); }
#musicBtn.muted{ opacity:.55; }

/* ============================================================
   LAYER SYSTEM
   ============================================================ */
.layer{
  position:fixed; inset:0; z-index:10;
  display:flex;
  padding:calc(22px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  opacity:0; visibility:hidden;
  transform:translateY(30px) scale(.97);
  filter:blur(6px);
  transition:
    opacity .55s cubic-bezier(.22,.8,.32,1),
    transform .55s cubic-bezier(.22,.8,.32,1),
    filter .55s cubic-bezier(.22,.8,.32,1),
    visibility .55s;
}
.layer.active{
  opacity:1; visibility:visible;
  transform:none; filter:none;
}
.layer-inner{
  margin:auto;
  width:100%; max-width:980px;
  display:flex; flex-direction:column; align-items:center;
}

.em{
  -webkit-text-fill-color: initial !important;
  -webkit-background-clip: initial !important;
  background-clip: initial !important;
  background: none !important;
  color: initial !important;
  display: inline-block;
  filter: drop-shadow(0 2px 4px rgba(214,51,108,.25));
  animation: emojiWave 2.4s ease-in-out infinite;
  transform-origin: 50% 80%;
}
@keyframes emojiWave{
  0%,100%{ transform:rotate(-9deg) scale(1);    }
  50%    { transform:rotate(9deg)  scale(1.14); }
}

/* ============================================================
   LAYER 1 — CARD
   ============================================================ */
.card{
  width:100%; max-width:440px;
  padding:36px 26px 32px;
  border-radius:32px;
  background:rgba(255,255,255,.76);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  border:2px solid rgba(255,255,255,.95);
  box-shadow:
    0 24px 60px rgba(214,51,108,.18),
    0 2px 0 rgba(255,255,255,.9) inset,
    0 0 60px rgba(255,182,213,.35);
  display:flex; flex-direction:column; gap:16px;
  text-align:center; position:relative; z-index:12;
  transform-style:preserve-3d;
  transition:transform .18s ease-out, box-shadow .3s ease;
  will-change:transform;
}
.card::after{
  content:'';
  position:absolute; inset:-3px;
  border-radius:34px;
  background:conic-gradient(from 0deg,
    rgba(255,77,148,0),
    rgba(255,77,148,.55),
    rgba(255,182,213,0),
    rgba(194,24,91,.45),
    rgba(255,77,148,0));
  z-index:-1; filter:blur(14px);
  animation:ringSpin 8s linear infinite;
  opacity:.85;
}
@keyframes ringSpin{ to{ transform:rotate(360deg); } }

.card-emoji{
  font-size:2.9rem; line-height:1;
  animation:bob 3s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(214,51,108,.25));
}
@keyframes bob{
  0%,100%{ transform:translateY(0) rotate(-6deg); }
  50%    { transform:translateY(-10px) rotate(6deg); }
}

.title{
  margin:0;
  font-size:clamp(1.35rem, 5.6vw, 1.85rem);
  font-weight:800; line-height:1.4;
  background:linear-gradient(90deg,#ff4d94,#c2185b,#ff7ab3,#e91e63,#ff4d94);
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:titleShimmer 5s linear infinite;
}
@keyframes titleShimmer{
  0%  { background-position:0% 50%; }
  100%{ background-position:250% 50%; }
}

#nameInput{
  width:100%; padding:17px 18px;
  font-size:1.03rem; font-weight:600;
  font-family:inherit; color:#7a1f47; text-align:center;
  border-radius:18px; border:2px solid #ffc2dd;
  background:rgba(255,255,255,.95);
  outline:none; caret-color:#ff4d94;
  transition:border-color .25s ease, box-shadow .3s ease, transform .2s ease, background .3s ease;
}
#nameInput::placeholder{ color:#e79ac0; font-weight:500; }
#nameInput:focus{
  border-color:#ff4d94;
  box-shadow:0 0 0 5px rgba(255,77,148,.18), 0 0 25px rgba(255,77,148,.28);
  background:#fff; transform:translateY(-1px);
}
#nameInput:disabled{ opacity:.75; }

.btn{
  position:relative; overflow:hidden;
  width:100%; padding:17px 22px;
  font-family:inherit; font-size:1.05rem; font-weight:800;
  letter-spacing:.2px; color:#fff;
  border:none; border-radius:18px; cursor:pointer;
  background:linear-gradient(135deg,#ff7ab3,#ff4d94 50%,#e91e63);
  background-size:200% 200%;
  box-shadow:
    0 14px 30px rgba(255,77,148,.38),
    0 2px 0 rgba(255,255,255,.35) inset;
  transition:transform .14s ease, box-shadow .25s ease, opacity .2s ease, background-position .4s ease;
  -webkit-user-select:none; user-select:none;
  isolation:isolate;
}
.btn::before{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
  transform:translateX(-120%);
  transition:transform .7s ease;
  z-index:-1;
}
.btn:hover{ background-position:100% 50%; box-shadow:0 16px 36px rgba(255,77,148,.48); }
.btn:hover::before{ transform:translateX(120%); }
.btn:active{ transform:scale(.97); }
.btn:disabled{ cursor:default; opacity:.7; }

.ripple{
  position:absolute; width:22px; height:22px;
  margin-left:-11px; margin-top:-11px;
  border-radius:50%;
  background:rgba(255,255,255,.65);
  transform:scale(0);
  animation:rippleAnim .75s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim{ to{ transform:scale(22); opacity:0; } }

.feedback{
  margin:0; min-height:28px;
  font-size:1rem; font-weight:700;
  color:#c2185b;
  opacity:0; transform:translateY(8px);
  transition:opacity .35s ease, transform .35s ease;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.feedback.show{ opacity:1; transform:translateY(0); }
.feedback.error{ color:#d81b60; }

@keyframes shake{
  0%,100%{ transform:translateX(0) rotate(0deg); }
  12%    { transform:translateX(-12px) rotate(-1.4deg); }
  28%    { transform:translateX(11px)  rotate(1.4deg); }
  44%    { transform:translateX(-9px)  rotate(-.9deg); }
  60%    { transform:translateX(8px)   rotate(.9deg); }
  76%    { transform:translateX(-5px); }
  88%    { transform:translateX(4px); }
}
.shake{ animation:shake .58s cubic-bezier(.36,.07,.19,.97); }

/* ============================================================
   FULLSCREEN FEEDBACK OVERLAY
   ============================================================ */
.feedback-overlay{
  position:fixed; inset:0; z-index:520;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:22px;
  padding:30px;
  background:radial-gradient(circle at 50% 45%,
    rgba(255,245,250,.99) 0%,
    rgba(255,214,232,.98) 50%,
    rgba(255,182,213,.96) 100%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  backdrop-filter:blur(24px) saturate(140%);
  opacity:0; visibility:hidden;
  transition:opacity .4s ease, visibility .4s;
  text-align:center;
}
.feedback-overlay.show{ opacity:1; visibility:visible; }

.fo-icon{
  font-size:clamp(3rem, 13vw, 5.5rem);
  line-height:1;
  animation:bob 2.4s ease-in-out infinite;
  filter:drop-shadow(0 10px 22px rgba(214,51,108,.35));
}
.fo-text{
  font-size:clamp(1.7rem, 8.4vw, 3.4rem);
  font-weight:900;
  line-height:1.3;
  color:#c2185b;
  letter-spacing:-.5px;
  text-shadow:0 6px 28px rgba(255,77,148,.35);
  max-width:900px;
  padding:0 8px;
}
.fo-text.animate{
  animation: foPop .75s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes foPop{
  from{ opacity:0; transform:scale(.7) translateY(28px); }
  to  { opacity:1; transform:none; }
}

/* ============================================================
   LAYER 2 — QUESTION CARD
   ============================================================ */
.question-card{
  width:100%; max-width:460px;
  padding:42px 28px 38px;
  border-radius:32px;
  background:rgba(255,255,255,.80);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  border:2px solid rgba(255,255,255,.95);
  box-shadow:
    0 24px 60px rgba(214,51,108,.20),
    0 0 60px rgba(255,182,213,.4);
  display:flex; flex-direction:column; gap:18px;
  text-align:center; position:relative; z-index:12;
  animation: cardFadeIn .65s cubic-bezier(.22,.8,.32,1) both;
}
@keyframes cardFadeIn{
  from{ opacity:0; transform:translateY(28px) scale(.96); }
  to  { opacity:1; transform:none; }
}
.question-card.leaving{
  animation: cardLeave .5s cubic-bezier(.6,-0.28,.74,.05) forwards;
}
@keyframes cardLeave{
  to{ opacity:0; transform:translateY(-40px) scale(.9); }
}

.q-line{
  font-size:clamp(1.18rem, 4.8vw, 1.5rem);
  font-weight:800;
  color:#c2185b;
  line-height:1.5;
  text-shadow:0 2px 12px rgba(255,77,148,.15);
}
.q-line:first-of-type{
  font-size:clamp(1.28rem, 5.3vw, 1.65rem);
}

.q-emoji{
  font-size:2.8rem; line-height:1;
  animation:bob 2.8s ease-in-out infinite;
  filter:drop-shadow(0 6px 12px rgba(214,51,108,.3));
}

/* ============================================================
   LAYER 2 — SCATTERED PHOTOS (6 photos)
   ============================================================ */
.photo-scatter{
  display:none;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:26px 16px;
  width:100%;
  max-width:540px;
  padding:20px 4px 40px;
}
.photo-scatter.visible{ display:flex; }

.p-entry{
  width:calc(50% - 8px);
  max-width:220px;
  opacity:0;
  will-change:transform,opacity;
}
.p-entry.e1{ animation: enterLeft     1.15s cubic-bezier(.34,1.56,.64,1) forwards; }
.p-entry.e2{ animation: enterTop      1.15s cubic-bezier(.34,1.56,.64,1) forwards; }
.p-entry.e3{ animation: enterZoom     1.15s cubic-bezier(.34,1.56,.64,1) forwards; }
.p-entry.e4{ animation: enterRight    1.15s cubic-bezier(.34,1.56,.64,1) forwards; }
.p-entry.e5{ animation: enterBot      1.15s cubic-bezier(.34,1.56,.64,1) forwards; }
.p-entry.e6{ animation: enterDiagonal 1.15s cubic-bezier(.34,1.56,.64,1) forwards; }

@keyframes enterLeft{
  from{ opacity:0; transform:translateX(-180%) rotate(-25deg) scale(.55); }
  to  { opacity:1; transform:none; }
}
@keyframes enterTop{
  from{ opacity:0; transform:translateY(-180%) rotate(20deg) scale(.55); }
  to  { opacity:1; transform:none; }
}
@keyframes enterZoom{
  from{ opacity:0; transform:scale(.1) rotate(-40deg); }
  60% { opacity:1; transform:scale(1.15) rotate(9deg); }
  to  { opacity:1; transform:none; }
}
@keyframes enterRight{
  from{ opacity:0; transform:translateX(180%) rotate(25deg) scale(.55); }
  to  { opacity:1; transform:none; }
}
@keyframes enterBot{
  from{ opacity:0; transform:translateY(200%) rotate(-20deg) scale(.55); }
  to  { opacity:1; transform:none; }
}
@keyframes enterDiagonal{
  from{ opacity:0; transform:translate(160%, 160%) rotate(35deg) scale(.55); }
  to  { opacity:1; transform:none; }
}

.polaroid{
  width:100%;
  padding:9px 9px 26px;
  background:#fff;
  border-radius:8px;
  box-shadow:
    0 14px 32px rgba(214,51,108,.24),
    0 3px 8px rgba(0,0,0,.07);
  position:relative;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
  will-change:transform;
  transform-origin:center;
}
.polaroid::after{
  content:'';
  position:absolute;
  left:50%; bottom:6px;
  width:32%; height:2px;
  background:radial-gradient(ellipse at center, rgba(214,51,108,.22), transparent 70%);
  transform:translateX(-50%);
}
.polaroid img{
  display:block;
  width:100%;
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:4px;
  background:#ffe9f3;
}

.polaroid.p1{ animation: floatA 4.2s ease-in-out infinite; }
.polaroid.p2{ animation: floatB 5.1s ease-in-out infinite .4s; }
.polaroid.p3{ animation: floatC 4.6s ease-in-out infinite .8s; }
.polaroid.p4{ animation: floatD 5.5s ease-in-out infinite .2s; }
.polaroid.p5{ animation: floatE 4.9s ease-in-out infinite .6s; }
.polaroid.p6{ animation: floatF 5.3s ease-in-out infinite .3s; }

@keyframes floatA{
  0%,100%{ transform:rotate(-7deg) translateY(-6px); }
  50%    { transform:rotate(-4deg) translateY(7px) translateX(-4px); }
}
@keyframes floatB{
  0%,100%{ transform:rotate(6deg) translateY(8px); }
  50%    { transform:rotate(3deg) translateY(-6px) translateX(5px); }
}
@keyframes floatC{
  0%,100%{ transform:rotate(-3deg) translateY(-4px) scale(1); }
  50%    { transform:rotate(0deg)  translateY(6px)  scale(1.03); }
}
@keyframes floatD{
  0%,100%{ transform:rotate(5deg) translateY(6px); }
  50%    { transform:rotate(2deg) translateY(-8px) translateX(-3px); }
}
@keyframes floatE{
  0%,100%{ transform:rotate(-6deg) translateY(-8px); }
  50%    { transform:rotate(-3deg) translateY(6px) translateX(4px); }
}
@keyframes floatF{
  0%,100%{ transform:rotate(4deg) translateY(-5px); }
  50%    { transform:rotate(7deg) translateY(8px) translateX(3px); }
}

@media (max-width: 560px){
  .photo-scatter{ max-width:420px; }
  .p-entry.e5, .p-entry.e6{ margin:0 auto; }
}
@media (min-width: 800px){
  .photo-scatter{
    max-width:880px;
    gap:38px 26px;
    padding:30px 12px 50px;
  }
  .p-entry{
    width:calc(33.333% - 18px);
    max-width:250px;
  }
}
@media (hover: hover){
  .polaroid:hover{
    transform:rotate(0deg) scale(1.1) translateY(-6px) !important;
    box-shadow:0 22px 46px rgba(214,51,108,.38), 0 4px 12px rgba(0,0,0,.1);
    z-index:8;
    animation-play-state: paused;
  }
}

.msg-btn{
  margin-top:12px; max-width:340px;
  opacity:0; visibility:hidden;
  transition:opacity .5s ease, visibility .5s;
}
.msg-btn.visible{ opacity:1; visibility:visible; }

/* ============================================================
   FULL-SCREEN MESSAGE — letter + scattered photos
   ============================================================ */
.fullscreen-message{
  position:fixed; inset:0; z-index:300;
  display:none;
  background:linear-gradient(135deg,#fff0f6 0%,#ffd6e8 35%,#ffe3f0 65%,#ffc9e0 100%);
  background-size:300% 300%;
  animation:bgMove 22s ease infinite;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  opacity:0;
  transition:opacity .45s ease;
}
.fullscreen-message.show{ display:block; opacity:1; }
.fullscreen-message::before{
  content:'';
  position:fixed; inset:-10%;
  background:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,.55), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(255,182,213,.45), transparent 50%);
  pointer-events:none; z-index:0;
  animation:shimmer 16s ease-in-out infinite alternate;
}

.fs-scroll{
  position:relative;
  min-height:100%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));
  z-index:2;
}

.letter-stage{
  width:100%;
  max-width:720px;
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
  margin:0 auto;
}

@media (min-width: 1024px){
  .letter-stage{
    max-width:1240px;
    grid-template-columns:220px minmax(0, 1fr) 220px;
    gap:36px;
    align-items:start;
  }
}

.letter-side{
  display:flex;
  flex-direction:column;
  gap:30px;
  align-items:center;
  padding-top:20px;
}

/* MOBILE: both sides become a horizontal thumbnail row */
@media (max-width: 1023px){
  .letter-side{
    flex-direction:row;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    padding-top:0;
  }
  .letter-side .mini-polaroid{
    width:78px;
    padding:4px 4px 14px;
    border-radius:5px;
  }
  .letter-side .mini-polaroid img{
    border-radius:3px;
  }
}

@media (min-width: 1024px){
  .letter-side .mini-polaroid{
    width:100%;
    max-width:210px;
  }
}

.mini-polaroid{
  padding:8px 8px 22px;
  background:#fff;
  border-radius:7px;
  box-shadow:
    0 16px 34px rgba(214,51,108,.30),
    0 3px 8px rgba(0,0,0,.08);
  position:relative;
  opacity:0;
  transform-origin:center;
  animation: popPhotoIn .9s cubic-bezier(.34,1.56,.64,1) forwards;
  will-change:transform, opacity;
  transition:transform .4s ease;
}
.mini-polaroid::after{
  content:'';
  position:absolute;
  left:50%; bottom:6px;
  width:34%; height:2px;
  background:radial-gradient(ellipse at center, rgba(214,51,108,.25), transparent 70%);
  transform:translateX(-50%);
}
.mini-polaroid img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:4px;
  background:#ffe9f3;
}
@keyframes popPhotoIn{
  0%  { opacity:0; transform:translateY(28px) scale(.55) rotate(0deg); }
  60% { opacity:1; transform:translateY(-4px) scale(1.05) rotate(var(--rot, 0deg)); }
  100%{ opacity:1; transform:translateY(0)    scale(1)    rotate(var(--rot, 0deg)); }
}

.fs-inner{
  width:100%;
  padding:38px 26px 32px;
  border-radius:32px;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
  border:2px solid rgba(255,255,255,.98);
  box-shadow:
    0 26px 65px rgba(214,51,108,.22),
    0 0 70px rgba(255,182,213,.45),
    0 2px 0 rgba(255,255,255,.9) inset;
  position:relative;
  animation:fsIn .55s cubic-bezier(.22,.8,.32,1) both;
}
@keyframes fsIn{
  from{ opacity:0; transform:translateY(24px) scale(.96); }
  to  { opacity:1; transform:none; }
}
.fs-close{
  position:absolute;
  top:14px; right:14px;
  width:42px; height:42px;
  display:grid; place-items:center;
  border:2px solid rgba(255,255,255,.95);
  border-radius:50%;
  background:rgba(255,255,255,.9);
  color:#c2185b;
  font-size:1.05rem; font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(214,51,108,.22);
  transition:transform .15s ease, box-shadow .25s ease;
  z-index:5;
}
.fs-close:hover{ box-shadow:0 10px 26px rgba(214,51,108,.35); }
.fs-close:active{ transform:scale(.9); }

.message-box{ width:100%; padding:4px 4px 0; }

.line{
  margin:0 0 16px;
  opacity:0;
  animation:fadeUp .5s ease forwards;
  word-wrap:break-word; overflow-wrap:break-word;
  font-size:clamp(1rem, 4.1vw, 1.14rem);
}
.line:last-child{ margin-bottom:0; }
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(14px); }
  to  { opacity:1; transform:translateY(0); }
}
.line-lead{
  font-size:clamp(1.08rem, 4.4vw, 1.28rem);
  font-weight:800; color:#c2185b; line-height:1.65;
}
.line-girl{
  font-size:clamp(1rem, 3.9vw, 1.1rem);
  font-weight:600; color:#a3245c; line-height:1.7;
  padding-left:15px; border-left:3px solid #ffc2dd;
}
.line-highlight{
  font-size:clamp(1.22rem, 5vw, 1.5rem);
  font-weight:900; line-height:1.55;
  background:linear-gradient(90deg,#ff4d94,#e91e63,#ff7ab3,#ff4d94);
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:titleShimmer 4s linear infinite;
}
.line-para{
  font-size:clamp(1rem, 3.9vw, 1.08rem);
  font-weight:500; color:#7a1f47; line-height:1.85;
}
.line-sign{
  font-size:clamp(1.02rem, 4vw, 1.12rem);
  font-weight:700; color:#c2185b; margin-top:10px;
}
.line-name{
  font-size:clamp(1.36rem, 5.6vw, 1.7rem);
  font-weight:900; font-style:italic;
  text-align:right; color:#d6336c;

  text-shadow:0 2px 12px rgba(255,77,148,.35);
}

.cursor{
  display:inline-block;
  width:2px; height:1em;

  margin-left:3px;
  vertical-align:-2px;
  animation:blink .85s step-end infinite;
  box-shadow:0 0 8px rgba(255,77,148,.8);
}
@keyframes blink{ 50%{ opacity:0; } }

.next-btn{ margin-top:22px; max-width:340px; margin-left:auto; margin-right:auto; }
.hidden{ display:none !important; }

.skip-btn{
  position:fixed;
  right:16px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:410;
  padding:12px 20px;
  font-family:inherit; font-size:.9rem; font-weight:800;
  color:#c2185b;
  background:rgba(255,255,255,.95);

@keyframes btnPulse{

}

.line-reply{

  font-weight:800;
  font-size:clamp(1.05rem, 4.3vw, 1.25rem);

  padding:14px 16px;

/* ============================================================
   LAYER 3 — FINAL BIRTHDAY CARD
   ============================================================ */
.big-card{
  width:100%; max-width:560px;
  padding:44px 28px 42px;
  border-radius:38px;
  text-align:center;
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  border:2px solid rgba(255,255,255,.98);
  box-shadow:0 28px 65px rgba(214,51,108,.24), 0 0 70px rgba(255,182,213,.5);
  position:relative; z-index:12;
  animation:popIn .9s cubic-bezier(.2,.85,.3,1.25) both;

}
@keyframes popIn{
  from{ opacity:0; transform:scale(.88) translateY(28px); }
  to  { opacity:1; transform:scale(1) translateY(0); }
}
.big-card::after{
  content:'';
  position:absolute; inset:-50%;
  background:conic-gradient(from 0deg,
    transparent 0deg,
    rgba(255,77,148,.18) 90deg,

    rgba(255,182,213,.22) 270deg,
    transparent 360deg);
  animation:ringSpin 12s linear infinite;

}
.big-emoji{
  font-size:clamp(2.4rem, 9vw, 3.4rem);

  animation:bob 2.8s ease-in-out infinite;

}
.big-sub{
  margin:10px 0 0;
  font-size:clamp(.82rem, 3.5vw, .98rem);

.big-name{
  margin:8px 0 4px;
  font-size:clamp(1.8rem, 7.5vw, 2.8rem);
  font-weight:900; line-height:1.15;
  background:linear-gradient(135deg,#ff4d94,#c2185b,#ff7ab3,#e91e63,#ff4d94);
  background-size:250% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:titleShimmer 5s linear infinite;
  position:relative; z-index:2;
  filter:drop-shadow(0 4px 18px rgba(255,77,148,.28));
}
.big-age{
  margin:6px 0 26px;
  font-size:clamp(.95rem, 4vw, 1.12rem);

  position:relative; z-index:2;
}
.final-photo-wrap{
  display:inline-block;
  padding:10px 10px 30px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 22px 55px rgba(214,51,108,.30), 0 4px 12px rgba(0,0,0,.08);
  transform:rotate(-3deg);

}
.final-photo-wrap::after{
  content:'';
  position:absolute;
  left:50%; bottom:8px;

.final-photo-wrap img{

@keyframes finalPhotoFloat{

}
.big-footer{
  margin:28px 0 0;

.big-footer strong{

}

@media (max-width:400px){
  .card{ padding:30px 20px 26px; border-radius:28px; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.05ms !important;
  }
}
</style>
</head>
<body>

<audio id="bgSong" src="song.mp3" loop preload="auto"></audio>

<canvas id="fxCanvas" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<!-- ============================================================

<!-- FULLSCREEN FEEDBACK OVERLAY -->

      <div class="msg-btns" id="qBtns">

      <div class="p-entry" data-i="2"><div class="polaroid p2"><img src="image2.png" alt="Memory 2" /></div></div>
      <div class="p-entry" data-i="3"><div class="polaroid p3"><img src="image3.png" alt="Memory 3" /></div></div>
      <div class="p-entry" data-i="4"><div class="polaroid p4"><img src="image4.png" alt="Memory 4" /></div></div>
      <div class="p-entry" data-i="5"><div class="polaroid p5"><img src="image5.png" alt="Memory 5" /></div></div>

<!-- ============================================================
     LAYER 3 — FINAL BIRTHDAY CARD
     ============================================================ -->
<section class="layer" id="layer3">

      <span class="big-emoji em">🎂</span>
      <p class="big-sub">Happiest Birthday</p>
      <h2 class="big-name">Kanaka Sruthi Rajesh</h2>
      

      <div class="final-photo-wrap">
        <img src="image1.png" alt="Kanaka" />
      </div>

   
    </div>
  </div>
</section>

<script>
/* ============================================================
   HELPERS
   ============================================================ */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ============================================================
   CANVAS PARTICLE ENGINE
   ============================================================ */
const canvas = $('#fxCanvas');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

function resizeCanvas(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));

const particles = [];
const MAX_PARTICLES = 900;

const EMOJIS = ['🎉','✨','🌟','⭐','🎈','🎂','🥳','🦋','🌸','🌈','🎊','🍰','🌻','🎁','💐','🧁','🍭','🌷','🎀'];
const CONFETTI_COLORS = ['#ff4d94','#ff7ab3','#ffd54f','#4fc3f7','#81c784','#ba68c8','#ffb74d','#f48fb1','#aed581','#e91e63'];
const SPARKLE_COLORS  = ['#ffffff','#ffe9f3','#ffd6e8','#ffb3d1','#ff7ab3','#ffd54f'];

function drawStar(x, y, size, color, alpha){
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++){
    const ang = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? size : size * 0.4;
    const px = x + Math.cos(ang) * r;
    const py = y + Math.sin(ang) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}
function drawBalloon(x, y, size, color, alpha){
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, size * 0.75, size, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.8)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x, y + size);
  ctx.quadraticCurveTo(x + 6, y + size + 14, x, y + size + 26);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath();
  ctx.ellipse(x - size * 0.25, y - size * 0.35, size * 0.16, size * 0.24, -0.4, 0, Math.PI * 2);
  ctx.fill();
}

function spawnAmbient(force){
  if (particles.length > MAX_PARTICLES - 40) return;
  const roll = Math.random();
  const emojiThreshold = force ? 0.7 : 0.45;

  if (roll < emojiThreshold){
    const isInitial = force && Math.random() < 0.75;
    particles.push({
      kind:'emoji', char:pick(EMOJIS),
      x: isInitial ? rand(30, W - 30) : rand(20, W - 20),
      y: isInitial ? rand(60, H - 60) : H + 40,
      vx: rand(-0.35, 0.35), vy: isInitial ? rand(-0.5, 0.5) : -rand(0.35, 0.85),
      size: rand(18, 34),
      angle: rand(0, Math.PI * 2), spin: rand(-0.015, 0.015),
      alpha: isInitial ? rand(0.5, 0.85) : 0,
      targetAlpha: rand(0.5, 0.9),
      life: isInitial ? rand(500, 1500) : 0,
      maxLife: rand(13000, 20000)
    });
  } else if (roll < 0.72){
    particles.push({
      kind:'star', x: rand(10, W - 10),
      y: force ? rand(30, H - 30) : H + 20,
      vx: rand(-0.4, 0.4), vy: -rand(0.35, 0.95),
      size: rand(3.5, 8), color: pick(SPARKLE_COLORS),
      alpha: force ? 0.7 : 0, targetAlpha: rand(0.45, 0.85),
      life: force ? rand(400, 1200) : 0, maxLife: rand(9000, 15000)
    });
  } else if (roll < 0.9){
    particles.push({
      kind:'sparkle', x: rand(10, W - 10),
      y: force ? rand(30, H - 30) : H + 20,
      vx: rand(-0.5, 0.5), vy: -rand(0.3, 0.9),
      size: rand(2, 4.5), color: pick(SPARKLE_COLORS),
      alpha: force ? 0.75 : 0, targetAlpha: rand(0.55, 0.95),
      life: force ? rand(400, 1000) : 0, maxLife: rand(8000, 14000)
    });
  } else {
    particles.push({
      kind:'balloon', x: rand(30, W - 30),
      y: force ? rand(40, H - 40) : H + 60,
      vx: rand(-0.3, 0.3), vy: -rand(0.5, 1.1),
      size: rand(9, 16),
      color: pick(['#ff4d94','#ff7ab3','#ffd54f','#4fc3f7','#81c784','#ba68c8']),
      alpha: force ? 0.6 : 0, targetAlpha: rand(0.5, 0.85),
      life: force ? rand(400, 1200) : 0, maxLife: rand(12000, 18000)
    });
  }
}

function confettiBurst(x, y, count = 130){
  for (let i = 0; i < count; i++){
    const ang = rand(0, Math.PI * 2);
    const spd = rand(3, 11);
    particles.push({
      kind:'confetti', x, y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - rand(2, 6),
      size: rand(5, 9), color: pick(CONFETTI_COLORS),
      angle: rand(0, Math.PI * 2), spin: rand(-0.35, 0.35),
      gravity: 0.16, drag: 0.985,
      alpha: 1, life: 0, maxLife: rand(3800, 6000)
    });
  }
}

function firework(x, y){
  const hue = randInt(0, 360);
  const count = randInt(48, 78);
  for (let i = 0; i < count; i++){
    const ang = (i / count) * Math.PI * 2 + rand(-0.08, 0.08);
    const spd = rand(2, 5.5);
    particles.push({
      kind:'sparkle', x, y,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      size: rand(2, 3.6),
      color: `hsl(${hue + rand(-25, 25)}, 100%, ${randInt(58, 82)}%)`,
      gravity: 0.045, drag: 0.965,
      alpha: 1, life: 0, maxLife: rand(1100, 1900)
    });
  }
}
function fireworkShow(count = 5, spread = 0.7){
  for (let i = 0; i < count; i++){
    setTimeout(() => firework(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * spread)), i * 320);
  }
}
function balloonRise(count = 22){
  for (let i = 0; i < count; i++){
    setTimeout(() => {
      particles.push({
        kind:'balloon', x: rand(30, W - 30), y: H + 60,
        vx: rand(-0.5, 0.5), vy: -rand(1.2, 2.4),
        size: rand(12, 22),
        color: pick(['#ff4d94','#ff7ab3','#ffd54f','#4fc3f7','#81c784','#ba68c8']),
        alpha: 0, targetAlpha: rand(0.7, 1),
        life: 0, maxLife: rand(6000, 9000)
      });
    }, i * 110);
  }
}
function cursorSparkle(x, y){
  if (particles.length > MAX_PARTICLES - 5) return;
  particles.push({
    kind:'cursor', x, y,
    vx: rand(-0.9, 0.9), vy: rand(-1.2, 0.2),
    size: rand(2, 4.2), color: pick(SPARKLE_COLORS),
    alpha: 1, life: 0, maxLife: rand(500, 900)
  });
}

let lastAmbient = 0;
const AMBIENT_INTERVAL = 260;

function tick(now){
  ctx.clearRect(0, 0, W, H);

  if (now - lastAmbient > AMBIENT_INTERVAL){
    lastAmbient = now;
    spawnAmbient();
    if (Math.random() < 0.28) spawnAmbient();
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life += 16;

    if (p.kind === 'confetti'){
      p.vy += p.gravity; p.vx *= p.drag; p.vy *= p.drag; p.angle += p.spin;
    } else if (p.kind === 'sparkle' && p.gravity){
      p.vy += p.gravity; p.vx *= p.drag; p.vy *= p.drag;
    } else if (p.kind === 'cursor'){
      p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.05;
    } else if (p.kind === 'balloon'){
      p.vx += rand(-0.02, 0.02);
    } else if (p.kind === 'emoji'){
      p.vx += rand(-0.008, 0.008);
      p.vy += rand(-0.008, 0.008);
      p.vx = Math.max(-0.6, Math.min(0.6, p.vx));
      p.vy = Math.max(-1.2, Math.min(0.3, p.vy));
    }

    p.x += p.vx; p.y += p.vy;
    if (p.spin != null && p.kind === 'emoji') p.angle += p.spin;

    if (p.life < 500 && p.targetAlpha != null && p.alpha === 0){
      p.alpha = (p.life / 500) * p.targetAlpha;
    } else if (p.kind === 'cursor'){
      p.alpha = 1 - p.life / p.maxLife;
    } else if (p.life > p.maxLife - 1600 && p.targetAlpha != null){
      p.alpha = Math.max(0, p.targetAlpha * (1 - (p.life - (p.maxLife - 1600)) / 1600));
    } else if (p.targetAlpha != null && p.life >= 500 && p.life <= p.maxLife - 1600){
      p.alpha = p.targetAlpha;
    } else if (p.life > p.maxLife - 500){
      p.alpha = Math.max(0, 1 - (p.life - (p.maxLife - 500)) / 500);
    }

    const offscreen = p.y < -160 || p.y > H + 200 || p.x < -160 || p.x > W + 160;
    if (p.life > p.maxLife || offscreen){ particles.splice(i, 1); continue; }

    const a = Math.max(0, Math.min(1, p.alpha));

    if (p.kind === 'emoji'){
      ctx.globalAlpha = a;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.font = `${p.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.char, 0, 0);
      ctx.restore();
    } else if (p.kind === 'star' || p.kind === 'sparkle' || p.kind === 'cursor'){
      drawStar(p.x, p.y, p.size, p.color, a);
    } else if (p.kind === 'confetti'){
      ctx.globalAlpha = a;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    } else if (p.kind === 'balloon'){
      drawBalloon(p.x, p.y, p.size, p.color, a);
    }
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}

/* ============================================================

   ============================================================ */
const bgSong = $('#bgSong');
bgSong.volume = 0;
const SONG_VOLUME = 0.55;

let actx = null;
let soundEnabled = true;
let unlocked = false;

function ensureAudio(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e){ return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function playTone(freq, duration = 0.3, type = 'sine', volume = 0.12, delay = 0){
  if (!soundEnabled) return;
  const ac = ensureAudio();
  if (!ac) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}

const SFX = {
  click:  () => playTone(760, 0.08, 'triangle', 0.08),
  wrong:  () => { playTone(220, 0.18, 'sawtooth', 0.07); playTone(160, 0.24, 'sawtooth', 0.06, 0.06); },
  correct:() => { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => playTone(f, 0.35, 'sine', 0.11, i * 0.09)); },
  pop:    () => { playTone(900, 0.06, 'square', 0.05); playTone(1400, 0.05, 'sine', 0.04, 0.02); },
  whoosh: () => playTone(400, 0.5, 'sine', 0.06),
  sparkle:() => { playTone(1600, 0.1, 'sine', 0.05); playTone(2100, 0.12, 'sine', 0.04, 0.06); },
  ding:   () => { playTone(1046.5, 0.15, 'sine', 0.07); playTone(1568, 0.2, 'sine', 0.05, 0.05); }
};

let synthTimer = null;
let melodyIndex = 0;
let synthPlaying = false;
const MELODY = [523.25, 659.25, 783.99, 1046.50, 987.77, 783.99, 659.25, 587.33, 698.46, 880.00, 1046.50, 880.00, 783.99, 659.25, 587.33, 523.25];

function startSynthMelody(){
  if (synthPlaying) return;
  synthPlaying = true;
  const step = () => {
    if (!soundEnabled || !synthPlaying){ synthPlaying = false; return; }
    playTone(MELODY[melodyIndex % MELODY.length], 1.9, 'sine', 0.028);
    playTone(MELODY[(melodyIndex + 2) % MELODY.length] / 2, 2.4, 'triangle', 0.018);
    melodyIndex++;
    synthTimer = setTimeout(step, 1500);
  };
  step();
}
function stopSynthMelody(){
  clearTimeout(synthTimer);
  synthTimer = null;
  synthPlaying = false;
}

let fadeInterval = null;
function fadeSongTo(target, duration = 1500){
  clearInterval(fadeInterval);
  const start = bgSong.volume;
  const diff  = target - start;
  const steps = Math.max(1, Math.floor(duration / 40));
  let step = 0;
  fadeInterval = setInterval(() => {
    step++;
    bgSong.volume = Math.max(0, Math.min(1, start + diff * (step / steps)));
    if (step >= steps) clearInterval(fadeInterval);
  }, 40);
}
function startSong(){
  if (!bgSong.src) return;
  const p = bgSong.play();
  if (p && p.catch) p.catch(() => {});
  fadeSongTo(SONG_VOLUME, 2200);
}
function pauseSong(){
  fadeSongTo(0, 700);
  setTimeout(() => { if (bgSong.volume <= 0.01) bgSong.pause(); }, 780);
}

function unlockOnce(){
  if (unlocked) return;
  unlocked = true;
  ensureAudio();
  if (soundEnabled && currentLayer === 1) startSynthMelody();
  document.removeEventListener('pointerdown', unlockOnce);
  document.removeEventListener('keydown',   unlockOnce);
  document.removeEventListener('touchstart',unlockOnce);
}
document.addEventListener('pointerdown', unlockOnce, { once:false });
document.addEventListener('keydown',   unlockOnce, { once:false });
document.addEventListener('touchstart',unlockOnce, { once:false, passive:true });

/* ============================================================
   RIPPLE / TILT / CURSOR
   ============================================================ */
function attachRipple(el){
  el.addEventListener('pointerdown', (e) => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX ?? r.left + r.width / 2) - r.left;
    const y = (e.clientY ?? r.top + r.height / 2) - r.top;
    const rip = document.createElement('span');
    rip.className = 'ripple';
    rip.style.left = x + 'px';
    rip.style.top  = y + 'px';
    el.appendChild(rip);
    setTimeout(() => rip.remove(), 780);
  });
}
$$('.btn, .skip-btn, #musicBtn, .fs-close').forEach(attachRipple);

const isFinePointer = window.matchMedia('(pointer: fine)').matches;
function attachTilt(el, intensity = 8){
  if (!isFinePointer) return;
  el.addEventListener('mousemove', (e) => {
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width  - 0.5;
    const py = (e.clientY - r.top)  / r.height - 0.5;
    el.style.transform = `perspective(1000px) rotateY(${px * intensity}deg) rotateX(${-py * intensity}deg) translateZ(0)`;
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
}
if (isFinePointer){
  let lastTrail = 0;
  window.addEventListener('mousemove', (e) => {
    const now = performance.now();
    if (now - lastTrail < 32) return;
    lastTrail = now;
    cursorSparkle(e.clientX + rand(-4, 4), e.clientY + rand(-4, 4));
    if (Math.random() < 0.35) cursorSparkle(e.clientX + rand(-8, 8), e.clientY + rand(-8, 8));
  });
}

/* Photo triggers: after this line index finishes typing → drop the photo.
   Left column gets photos 0, 2, 4 (photo indexes) → image1, image3, image5
   Right column gets photos 1, 3, 5 (photo indexes) → image2, image4, image6 */
const PHOTO_TRIGGERS = {
  2:  0,   // left   → image1.png
  5:  1,   // right  → image2.png
  8:  2,   // left   → image3.png
  11: 3,   // right  → image4.png
  14: 4,   // left   → image5.png
  17: 5    // right  → image6.png
};

const PHOTO_SRCS = ['image1.png','image2.png','image3.png','image4.png','image5.png','image6.png'];
const PHOTO_ROTS = ['-6deg','5deg','-4deg','6deg','-5deg','4deg'];

const SPEED = 70;
const DELAY = 1200;

const fullscreen  = $('#fullscreenMsg');
const fsClose     = $('#fsClose');
const messageBox  = $('#messageBox');
const nextBtn     = $('#nextBtn');
const skipBtn     = $('#skipBtn');
const letterLeft  = $('#letterLeft');
const letterRight = $('#letterRight');

let skipFlag = false;
let typingActive = false;

function scrollFs(){ fullscreen.scrollTop = fullscreen.scrollHeight; }

function resetScrapbook(){
  letterLeft.innerHTML  = '';
  letterRight.innerHTML = '';
}

/* drop ONE photo into left or right column based on photo index parity */
function addScrapbookPhoto(photoIdx){
  const container = (photoIdx % 2 === 0) ? letterLeft : letterRight;

  const wrap = document.createElement('div');
  wrap.className = 'mini-polaroid';
  wrap.style.setProperty('--rot', PHOTO_ROTS[photoIdx]);

  const img = document.createElement('img');
  img.src = PHOTO_SRCS[photoIdx];
  img.alt = 'Memory ' + (photoIdx + 1);
  img.onerror = function(){
    this.onerror = null;
    this.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">' +
      '<rect width="400" height="400" fill="#ffe9f3"/>' +
      '<text x="200" y="215" font-size="90" text-anchor="middle">📷</text>' +
      '</svg>'
    );
  };

  wrap.appendChild(img);
  container.appendChild(wrap);

  SFX.pop();

  /* sparkle at the photo's spot */
  setTimeout(() => {
    const r = wrap.getBoundingClientRect();
    if (r.width > 0){
      confettiBurst(r.left + r.width / 2, r.top + r.height / 2, 20);
      if (Math.random() < 0.7) SFX.sparkle();
    }
  }, 400);
}

function typeLine(el, text, speed){
  return new Promise((resolve) => {
    const chars = Array.from(text);
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);

    if (skipFlag){
      cursor.remove();
      el.textContent = text;
      return resolve();
    }

    let i = 0;
    const timer = setInterval(() => {
      if (skipFlag){
        clearInterval(timer);
        cursor.remove();
        el.textContent = text;
        return resolve();
      }

      cursor.insertAdjacentText('beforebegin', chars[i]);
      i++;

      if (i % 2 === 0){
        const r = el.getBoundingClientRect();
        cursorSparkle(r.left + rand(0, Math.min(r.width, 480)), r.top + rand(0, 14));
      }
      if (i % 5 === 0 && Math.random() < 0.32){
        playTone(rand(1400, 2000), 0.03, 'sine', 0.018);
      }
      if (i % 28 === 0) scrollFs();

      if (i >= chars.length){
        clearInterval(timer);
        cursor.remove();
        resolve();
      }
    }, speed);
  });
}

async function appendLine(text, cls, speed){
  const p = document.createElement('p');
  p.className = 'line ' + cls;
  messageBox.appendChild(p);
  scrollFs();
  await typeLine(p, text, speed);
  scrollFs();
  return p;
}

async function playMessage(){
  if (typingActive) return;

  typingActive = true;
  skipFlag     = false;

  fullscreen.classList.add('show');
  document.body.style.overflow = 'hidden';
  messageBox.innerHTML = '';
  resetScrapbook();
  nextBtn.classList.add('hidden');

  firework(W * 0.5, H * 0.32);
  SFX.sparkle();

  await wait(500);
  skipBtn.classList.remove('hidden');

  /* type the letter; drop each photo as its trigger line finishes */
  for (let i = 0; i < LINES.length; i++){
    const line = LINES[i];
    await appendLine(line.t, line.c, SPEED);
    await wait(skipFlag ? 20 : DELAY);

    if (PHOTO_TRIGGERS[i] !== undefined){
      addScrapbookPhoto(PHOTO_TRIGGERS[i]);
    }

    if (line.c === 'line-highlight'){
      SFX.sparkle();
      confettiBurst(rand(W * 0.3, W * 0.7), rand(H * 0.3, H * 0.5), 30);
    }
  }

  typingActive = false;
  skipBtn.classList.add('hidden');
  nextBtn.classList.remove('hidden');
  scrollFs();

  firework(W * 0.28, H * 0.32);
  setTimeout(() => firework(W * 0.72, H * 0.28), 320);
  SFX.correct();
}
